name: QuranForiOS12
options:
  bundleIdPrefix: org.quranreader
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: "arm64"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Manual
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    CLANG_ENABLE_OBJC_MSGSEND_SELECTOR_STUBS: "NO"
    LD_RUNPATH_SEARCH_PATHS:
      - "/usr/lib/swift"
      - "@executable_path/Frameworks"
    OTHER_LDFLAGS:
      - "-Wl,-no_fixup_chains"
targets:
  QuranForiOS12:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
      - path: Supporting/LaunchScreen.storyboard
      - path: Resources/Assets.xcassets
      - path: Resources/BundledData
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.quranreader.ios12
        PRODUCT_NAME: Quran Reader
        INFOPLIST_FILE: Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        CLANG_ENABLE_OBJC_MSGSEND_SELECTOR_STUBS: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "/usr/lib/swift"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "-Wl,-no_fixup_chains"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
