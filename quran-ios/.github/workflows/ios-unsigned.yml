name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iPad/iPhone (iOS 12.0+ arm64, unsigned)
        run: >-
          xcodebuild
          -project QuranForiOS12.xcodeproj
          -scheme QuranForiOS12
          -sdk iphoneos
          -configuration Release
          -derivedDataPath build
          IPHONEOS_DEPLOYMENT_TARGET=12.0
          ARCHS=arm64
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES
          CLANG_ENABLE_OBJC_MSGSEND_SELECTOR_STUBS=NO
          LD_RUNPATH_SEARCH_PATHS="/usr/lib/swift @executable_path/Frameworks"
          OTHER_LDFLAGS="-Wl,-no_fixup_chains"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Embed Swift 5.0 Standard Libraries & Package unsigned IPA
        run: |
          chmod +x scripts/package-unsigned-ipa.sh
          ./scripts/package-unsigned-ipa.sh "build/Build/Products/Release-iphoneos/Quran Reader.app" "QuranReader-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: QuranReader-unsigned-ipa
          path: QuranReader-unsigned.ipa
          if-no-files-found: error
